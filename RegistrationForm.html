<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <link href="style2.css" rel="stylesheet">
</head>
<body>
    <h2>FriendshipZone</h2>
    <h3>Add your details to Register</h3>
    <form>
        <label for="Username">Name:</label>
        <input type="text" id="Username" name="Username" placeholder="Enter your Name">
        <br><br>
        <label for="email">Enter Valid Email Id:</label>
        <input type="email" id="email" name="email" placeholder="Enter your valid email id">
        <br><br>
        <label for="age">Enter your Age:</label>
        <input type="number" id="age" name="age"placeholder="Enter your age">
        <br><br>
        <label for="birthday">Enter your Birthday:</label>
        <input type="date" id="birthday" name="birthday">
        <br><br>
        <label for="gender">Enter your Gender:</label>
        <label for="gender">M</label>
        <input type="radio" id="gender" name="gender" value="M">
        <label for="gender">F</label>
        <input type="radio" id="gender" name="gender" value="F">
        <br><br>
        <label for="about">About:</label>
        <textarea id="about" name="about"></textarea>
        <br><br>
        <label for="number">Phone:</label>
        <input type="number" id="number" name="number" placeholder="Enter your mobile number">
        <br><br>
        <label for="interested">Interested in:</label>
        <label for="interested">Friendship</label>
        <input type="radio" id="interested" name="interested" value="Friendship">
        <label for="interested">Dating</label>
        <input type="radio" id="interested" name="interested" value="Dating">
        <br><br>
        <label for="file">Attachment:</label>
        <input type="file" id="file" name="file">
        <br>
        <button><a href="RegistrationConformation.html">Register</a></button>
        <button><a href="RegistrationConformationforAdmin.html">Register as admin</a></button>
    </form>
</body>
</html>
