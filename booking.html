    <h2>Book Your Service</h2> 
    <br>
    <form method="post" autocomplete="on">
    <label for="name">Name:</label>
    <input type="text" name="name">
    <br><br>
    <label for="email">Email Id:</label>
    <input type="email" name="email">
    <br><br>
    <label for="number">Phone Number:</label>
    <button type="button" id="countrycodeButton">code
        <select>
            <option value="+1">USA</option>
            <option value="+44">UK</option>
            <option value="+91">India</option>
        </select>
    </button>
    <input type="tel" name="number">
    <br><br>
    <label for="service">Select Service:</label>
    <select>
        <option value="1">preventive Maintenance service</option>
        <option value="2">Body Repair Service</option>
        <option value="3">Car Care Service</option>
    </select>
    <br><br>
    <label for="carmake">Car Make:</label>
    <input type="text" name="car make">
    <br><br>
    <label for="car model">Car Model:</label>
    <input type="text" name="Model">
    <br><br>
    <label for="Fueltype">Fuel Type:</label>
    <input type="radio" value="petrol">Petrol
    <input type="radio" value="petrol">Diesel
    <input type="radio" value="petrol">LPG
    <input type="radio" value="petrol">Others
    <br><br>
    <label for="km">Kilometers Ran:</label>
    <input type="number" name="km">
    <br><br><br>
    <button><a href="appointment.html">Schedule an Appointment</a></button>
    </form>
